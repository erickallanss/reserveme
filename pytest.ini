[pytest]
DJANGO_SETTINGS_MODULE = core.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --nomigrations
    --reuse-db
    --cov=reserveme
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
testpaths = reserveme/tests
